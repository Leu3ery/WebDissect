<div class="flex flex-col flex-1 min-h-0">
  <div class="flex gap-2 items-center px-3 md:px-5 pt-3 md:pt-4">
    <span class="mono text-(--text-2)" style="font-size:11px">{{ ports().length }} open port{{ ports().length === 1 ? '' : 's' }}</span>
  </div>
  <div class="flex-1 overflow-auto p-3 md:p-5">
    <div class="card overflow-hidden">
      <table class="dt">
        <thead>
          <tr>
            <th style="width:90px">Port</th>
            <th style="width:140px">Service</th>
            <th>Version</th>
            <th>Banner</th>
          </tr>
        </thead>
        <tbody>
          @for (r of ports(); track r.id) {
            <tr>
              <td data-label="Port"><span class="badge green" style="justify-content:center">{{ r.port }}/{{ r.protocol }}</span></td>
              <td data-label="Service">{{ r.service || '—' }}</td>
              <td class="muted" style="word-break:break-all" data-label="Version">{{ r.version || '—' }}</td>
              <td class="muted" style="word-break:break-all" data-label="Banner">{{ r.banner || '—' }}</td>
            </tr>
          } @empty {
            <tr><td colspan="4" class="muted" style="text-align:center;padding:24px">No open ports found. Run a port scan to populate this tab.</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
