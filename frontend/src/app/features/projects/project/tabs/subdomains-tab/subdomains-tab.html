<div class="flex flex-col flex-1 min-h-0">
  <div class="flex gap-2 items-center px-3 md:px-5 pt-3 md:pt-4">
    <div class="relative flex-1" style="max-width:360px">
      <svg lucideSearch size="14" class="absolute text-(--text-2)" style="left:11px;top:50%;transform:translateY(-50%)"></svg>
      <input class="input mono" placeholder="Filter by name or IP…"
             style="padding-left:34px;font-size:12.5px" [value]="query()" (input)="onSearch($event)">
    </div>
    <span class="mono text-(--text-2)" style="font-size:11px">{{ rows().length }} / {{ subdomains().length }}</span>
  </div>
  <div class="flex-1 overflow-auto p-3 md:p-5">
    <div class="card overflow-hidden">
      <table class="dt">
        <thead>
          <tr>
            <th>Subdomain</th>
            <th style="width:180px">IP address</th>
            <th style="width:90px">Source</th>
          </tr>
        </thead>
        <tbody>
          @for (r of rows(); track r.id) {
            <tr>
              <td style="word-break:break-all" data-label="Subdomain">{{ r.name }}</td>
              <td class="muted" data-label="IP address">{{ r.ip || '—' }}</td>
              <td data-label="Source"><span class="badge cyan">{{ r.source }}</span></td>
            </tr>
          } @empty {
            <tr><td colspan="3" class="muted" style="text-align:center;padding:24px">No subdomains found</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
