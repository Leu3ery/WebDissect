<div class="settings">
  <p class="text-(--text-2) border-b p-2">{{authService.user()?.email}}</p>
  <button class="settings-button" (click)="openChangePassword.emit()">
    <svg lucideKey size="16px" color="var(--accent)"></svg>
    <p>Change password</p>
  </button>
  <button class="settings-button" (click)="replayTour.emit()">
    <svg lucideCircleHelp size="16px" color="var(--accent)"></svg>
    <p>Restart tour</p>
  </button>
  <button class="settings-button" (click)="logout.emit()">
    <svg lucideLogOut color="var(--danger-2)" size="16px"></svg>
    <p class="text-(--danger-2)">Log out</p>
  </button>
</div>
