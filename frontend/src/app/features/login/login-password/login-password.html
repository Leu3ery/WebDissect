<div class="w-full flex flex-col gap-4">
  <form [formGroup]="form" (ngSubmit)="submit()" class="w-full flex flex-col gap-1.5">
    <label class="text-xs text-(--text-2)" for="email">SCHOOL EMAIL</label>
    <input formControlName="email" class="input w" type="text" name="email" placeholder="firstname.lastname@htlstp.at">
    <label class="text-xs text-(--text-2)" for="password">PASSWORD</label>
    <input formControlName="password" class="input w" type="password" name="password" placeholder="••••••••">
    <button type="submit" class="mt-2 btn btn-primary" [disabled]="form.invalid">Submit</button>
    @if (formError() != null) {
      <div class="error-field">{{formError()}}</div>
    }
  </form>
</div>
