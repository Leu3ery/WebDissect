<div class="flex justify-center items-center w-full h-full p-4">
  <div class="login-container">
    <div>
      <p class="text-3xl font-bold text-(--text) text-center">WebDissect</p>
      <p class="text-sm text-(--text-2) text-center">Website analysis tool</p>
    </div>
    <div class="buttons-container">
      <button (click)="toggleLoginPage()" class="switch-button" [class.switch-button-active]="!isLoginWithPassword()">Email code</button>
      <button (click)="toggleLoginPage()" class="switch-button" [class.switch-button-active]="isLoginWithPassword()">Password</button>
    </div>
    @if (isLoginWithPassword()) {
      <app-login-password></app-login-password>
    } @else {
      <app-login-email></app-login-email>
    }
  </div>
</div>
