@if (tour.active()) {
  <div class="tour-root">
    @if (hole(); as h) {
      <div
        class="tour-hole"
        [style.top.px]="h.top"
        [style.left.px]="h.left"
        [style.width.px]="h.width"
        [style.height.px]="h.height"
      ></div>
    } @else {
      <div class="tour-dim"></div>
    }

    <div
      class="tour-card"
      [class.center]="!card()"
      [style.top.px]="card()?.top"
      [style.left.px]="card()?.left"
      [style.width.px]="card() ? 340 : null"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="tour.current().title"
    >
      <button class="tour-close" type="button" (click)="tour.skip()" aria-label="Close tour">
        <svg lucideX [size]="16"></svg>
      </button>

      <p class="tour-step">Step {{ tour.index() + 1 }} of {{ tour.steps().length }}</p>
      <h3 class="tour-title">{{ tour.current().title }}</h3>
      <p class="tour-body" aria-live="polite">{{ tour.current().body }}</p>

      <div class="tour-dots">
        @for (s of tour.steps(); track $index) {
          <span class="tour-dot" [class.active]="$index === tour.index()"></span>
        }
      </div>

      <div class="tour-actions">
        <button class="btn btn-ghost btn-sm" type="button" (click)="tour.skip()">
          Skip
        </button>
        <div class="tour-nav">
          @if (!tour.isFirst()) {
            <button class="btn btn-sm" type="button" (click)="tour.prev()">Back</button>
          }
          <button class="btn btn-primary btn-sm" type="button" (click)="tour.next()">
            {{ tour.isLast() ? 'Done' : 'Next' }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
