services:
    backend-server:
        ports:
            - "60000:6767"
        volumes:
            -   "./db:/app/db"
        env_file:
            -  ".env"
        build:
            context: .
            dockerfile: backend/server/Dockerfile
    frontend-server:
        ports:
            - "80:80"
        build:
            context: .
            dockerfile: frontend/Dockerfile
        depends_on:
            -   backend-server

