services:
    backend-server:
        expose:
            - "6767"
        volumes:
            - "./storage:/app/storage"
        env_file:
            -  ".env"
        build:
            context: .
            dockerfile: backend/server/Dockerfile
    frontend-server:
        # No host port binding here: on Dokploy the host's :80 is owned by the
        # built-in Traefik proxy. Routing is done via a Domain configured in the
        # Dokploy UI (service frontend-server, container port 80). For local dev
        # the published port lives in docker-compose.override.yml.
        expose:
            - "80"
        build:
            context: ./frontend
            dockerfile: Dockerfile
        depends_on:
            -   backend-server

