services:
    backend-server:
        expose:
            - "6767"
        volumes:
            -   "./db:/app/db"
        env_file:
            -  ".env"
        environment:
            ENV: "production"
        build:
            context: .
            dockerfile: backend/server/Dockerfile
        restart: unless-stopped

    frontend-server:
        ports:
            - "8080:80"
        build:
            context: ./frontend
            dockerfile: Dockerfile
        depends_on:
            -   backend-server
        restart: unless-stopped
